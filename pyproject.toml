[project]
name = "autplay-codex-harness"
version = "0.1.0"
description = "Local Codex development orchestration for AutPlay"
requires-python = ">=3.14.7,<3.15"
dependencies = [
    "openai-codex==0.144.4",
]

[project.scripts]
autplay-codex = "autplay_codex.cli:main"
autplay-phase-stop = "autplay_codex.phase_orchestrator:main"

[dependency-groups]
dev = [
    "jsonschema==4.26.0",
    "mypy==2.3.0",
    "openapi-spec-validator==0.9.0",
    "pytest==9.1.1",
    "rfc8785==0.1.4",
    "ruff==0.16.2",
    "types-jsonschema==4.26.0.20260518",
]

[build-system]
requires = ["uv_build==0.12.3"]
build-backend = "uv_build"

[tool.uv]
required-version = "==0.12.3"

[tool.uv.build-backend]
module-name = "autplay_codex"
module-root = "tools/autplay_codex/src"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.format]
line-ending = "lf"
quote-style = "double"

[tool.mypy]
python_version = "3.14"
strict = true
files = ["tools/autplay_codex/src", "tools/autplay_codex/tests"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tools/autplay_codex/tests"]
