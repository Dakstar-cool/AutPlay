[project]
name = "autplay-contract-tools"
version = "0.1.0"
description = "Language-neutral contract validation tools for AutPlay"
requires-python = ">=3.14.7,<3.15"
dependencies = []

[dependency-groups]
dev = [
    "jsonschema==4.26.0",
    "mypy==2.3.0",
    "openapi-spec-validator==0.9.0",
    "pytest==9.1.1",
    "rfc8785==0.1.4",
    "ruff==0.16.2",
    "types-jsonschema==4.26.0.20260518",
]

[tool.uv]
package = false
required-version = "==0.12.3"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.format]
line-ending = "lf"
quote-style = "double"

[tool.mypy]
python_version = "3.14"
strict = true
files = ["tests/contract", "tests/release"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests/contract", "tests/release"]
