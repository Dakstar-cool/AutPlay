services:
  migrate:
    image: "${AUTPLAY_SERVER_IMAGE:?set AUTPLAY_SERVER_IMAGE to the loaded release image tag}"
    build: !reset null

  api:
    image: "${AUTPLAY_SERVER_IMAGE:?set AUTPLAY_SERVER_IMAGE to the loaded release image tag}"
    build: !reset null

  worker-cpu:
    image: "${AUTPLAY_SERVER_IMAGE:?set AUTPLAY_SERVER_IMAGE to the loaded release image tag}"
    build: !reset null
    healthcheck:
      timeout: 10s
      retries: 12
      start_period: 15s

  stream:
    image: "${AUTPLAY_SERVER_IMAGE:?set AUTPLAY_SERVER_IMAGE to the loaded release image tag}"
    build: !reset null
