name: Temporary / macOS dependency bootstrap

on:
  push:
    branches: [codex/macos-port-20261013]
    paths: [.github/workflows/macos-dependency-bootstrap.yml]

permissions:
  contents: read

jobs:
  official-dependency-seed:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MICROSOFT_JDK_URL: https://aka.ms/download-jdk/microsoft-jdk-17.0.20-linux-x64.tar.gz
      MICROSOFT_JDK_SHA256: 69479b83a0e4408cc24d4dfb551db3759ba145ddce6131c6806a97d7bd8604cd
    steps:
      - name: Check out dedicated port branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify pinned JDK archive
        run: |
          jdk_archive="${RUNNER_TEMP}/microsoft-jdk-17.0.20-linux-x64.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 --retry-delay 2 \
            --output "$jdk_archive" "$MICROSOFT_JDK_URL"
          printf '%s  %s\n' "$MICROSOFT_JDK_SHA256" "$jdk_archive" | sha256sum --check --strict
      - name: Install pinned Microsoft JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: jdkfile
          jdk-file: ${{ runner.temp }}/microsoft-jdk-17.0.20-linux-x64.tar.gz
          java-version: "17.0.20"
          architecture: x64
      - name: Seed exact official dependency graph for review
        run: |
          bash ./gradlew --no-daemon --console=plain --max-workers=1 \
            --write-verification-metadata sha256 -Pautplay.desktopOnly=true \
            -Pautplay.desktopRuntime=macos-arm64 \
            :shared:domain:jvmTest :shared:application:jvmTest :shared:ui:jvmTest \
            :apps:desktop:classes :apps:desktop:prepareDesktopRuntime
      - name: Package relocatable public dependency cache
        if: always()
        run: |
          mkdir -p build/dependency-seed
          cp gradle/verification-metadata.xml build/dependency-seed/
          git rev-parse HEAD > build/dependency-seed/source-commit.txt
          tar --exclude='*.lock' --exclude='gc.properties' -czf \
            build/dependency-seed/modules-2.tar.gz -C "${GRADLE_USER_HOME:-$HOME/.gradle}/caches" modules-2
          (cd build/dependency-seed && sha256sum modules-2.tar.gz verification-metadata.xml > SHA256SUMS)
      - name: Retain dependency seed for coordinator review
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-dependency-seed-${{ github.sha }}
          path: build/dependency-seed/
          if-no-files-found: error
          retention-days: 3
