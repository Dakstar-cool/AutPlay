name: CI / Server

on:
  pull_request:
  push:
    branches:
      - master
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-server-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-linux:
    name: Server / Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.3"
          python-version: "3.14.7"
          enable-cache: ${{ github.event_name != 'schedule' }}
          cache-dependency-glob: |
            uv.lock
            server/uv.lock

      - name: Run canonical server gate
        run: bash scripts/check.sh --server-only
