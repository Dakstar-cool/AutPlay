name: CI / Android

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-host:
    name: Android host / Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      MICROSOFT_JDK_URL: https://aka.ms/download-jdk/microsoft-jdk-17.0.20-linux-x64.tar.gz
      MICROSOFT_JDK_SHA256: 69479b83a0e4408cc24d4dfb551db3759ba145ddce6131c6806a97d7bd8604cd
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download verified pinned Microsoft JDK
        shell: bash
        run: |
          jdk_archive="${RUNNER_TEMP}/microsoft-jdk-17.0.20-linux-x64.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --retry 3 --retry-delay 2 \
            --output "$jdk_archive" \
            "$MICROSOFT_JDK_URL"
          printf '%s  %s\n' "$MICROSOFT_JDK_SHA256" "$jdk_archive" \
            | sha256sum --check --strict

      - name: Install pinned Microsoft JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: jdkfile
          jdk-file: ${{ runner.temp }}/microsoft-jdk-17.0.20-linux-x64.tar.gz
          java-version: "17.0.20"
          architecture: x64
          cache: gradle
          cache-dependency-path: |
            build.gradle.kts
            settings.gradle.kts
            gradle.properties
            gradle/libs.versions.toml
            gradle/wrapper/gradle-wrapper.properties
            apps/android/build.gradle.kts

      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.3"
          python-version: "3.14.7"
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            server/uv.lock

      - name: Install pinned Android SDK packages
        shell: bash
        run: |
          hosted_sdk_root="$ANDROID_HOME"
          sdkmanager_path="$hosted_sdk_root/cmdline-tools/latest/bin/sdkmanager"
          sdk_root="${RUNNER_TEMP}/android-sdk"
          test -x "$sdkmanager_path"
          test -d "$hosted_sdk_root/licenses"
          mkdir -p "$sdk_root"
          cp -R "$hosted_sdk_root/licenses" "$sdk_root/licenses"
          "$sdkmanager_path" --sdk_root="$sdk_root" \
            "platforms;android-36.1" "build-tools;36.1.0"
          printf 'ANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\n' "$sdk_root" "$sdk_root" \
            >> "$GITHUB_ENV"

      - name: Run canonical Android host gate
        run: bash scripts/check.sh

      - name: Upload short-lived Android build evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-host-${{ github.sha }}
          path: |
            apps/android/build/outputs/apk/debug/android-debug.apk
            apps/android/build/outputs/apk/release/android-release-unsigned.apk
            apps/android/build/reports/lint-results-debug.html
            apps/android/build/test-results/testDebugUnitTest/
          if-no-files-found: error
          retention-days: 7
