[project]
name = "autplay-local-music-acquisition"
version = "0.1.0"
description = "Portable local-only Jamendo, Hitmo CDP, and yt-dlp acquisition contours"
requires-python = ">=3.12,<3.15"
dependencies = [
    "playwright==1.60.0",
    "yt-dlp[default,pin]==2026.8.19",
]

[project.scripts]
local-music-acquire = "local_music_acquisition.cli:main"

[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/local_music_acquisition"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.2",
]

[tool.uv]
required-version = "==0.12.3"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.format]
line-ending = "lf"
quote-style = "double"
