<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">AutPlay: локальная музыка и переносимый аккаунт</title>
  <desc id="desc">Локальный телефон, стабильный аккаунт и необязательный личный сервер. Связи показывают синхронизацию данных аккаунта; воспроизведение на телефоне работает без сервера.</desc>
  <rect width="1200" height="340" rx="28" fill="#111215"/>
  <g id="connections" fill="none" stroke="#FF7854" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M332 144H446M432 134L446 144L432 154M346 134L332 144L346 154"/>
    <path d="M754 144H868M854 134L868 144L854 154M768 134L754 144L768 154"/>
  </g>
  <g id="local-phone" transform="translate(180 140)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="-43" y="-65" width="86" height="130" rx="15" stroke="#F4F3EF" stroke-width="5"/>
    <path d="M-14-49H14M-12 50H12" stroke="#B2B4BD" stroke-width="4"/>
    <path d="M-22 5V-9M-11 17V-24M0 26V-32M11 17V-24M22 5V-9" stroke="#FF7854" stroke-width="5"/>
  </g>
  <g id="account-identity" transform="translate(600 140)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cy="-28" r="27" stroke="#FF7854" stroke-width="5"/>
    <path d="M-57 54V42C-57 6 57 6 57 42V54" stroke="#F4F3EF" stroke-width="5"/>
    <circle cx="51" cy="-42" r="17" fill="#111215" stroke="#FF7854" stroke-width="4"/>
    <path d="M43-42L49-36L60-49" stroke="#FF7854" stroke-width="4"/>
  </g>
  <g id="personal-server" transform="translate(1020 140)" fill="none" stroke="#F4F3EF" stroke-width="5" stroke-linecap="round">
    <rect x="-63" y="-60" width="126" height="51" rx="12"/>
    <rect x="-63" y="12" width="126" height="51" rx="12"/>
    <path d="M-43-34H-8M-43 38H-8" stroke="#B2B4BD" stroke-width="4"/>
    <circle cx="39" cy="-34" r="5" fill="#FF7854" stroke="none"/>
    <circle cx="39" cy="38" r="5" fill="#FF7854" stroke="none"/>
  </g>
  <g id="labels" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" text-anchor="middle" font-weight="600" font-size="46" fill="#F4F3EF">
    <text x="180" y="266">Офлайн</text>
    <text x="600" y="266">Аккаунт</text>
    <text x="1020" y="266">Ваш сервер</text>
  </g>
</svg>
