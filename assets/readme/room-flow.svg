<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">AutPlay — одна комната, слушаем вместе</title>
  <desc id="desc">Ведущий собирает очередь, личный сервер согласует воспроизведение, участники слушают на своих устройствах. До восьми устройств, у каждого собственный доступ к музыке. Это схема работы комнаты, а не снимок интерфейса.</desc>
  <rect width="1200" height="360" rx="28" fill="#111215"/>
  <g id="shared-timeline" fill="none" stroke="#FF7854" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M292 135H468M732 135H908"/>
    <path d="M452 121L468 135L452 149M892 121L908 135L892 149"/>
  </g>
  <g id="host-queue" transform="translate(185 134)" fill="none" stroke="#F4F3EF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="-65" y="-64" width="130" height="128" rx="18"/>
    <path d="M-39-34H7M-39-6H-1M-39 22H-6" stroke="#B2B4BD"/>
    <path d="M23 8L46 23L23 38Z" fill="#FF7854" stroke="none"/>
  </g>
  <g id="room-server" transform="translate(600 134)" fill="none" stroke="#F4F3EF" stroke-width="5" stroke-linecap="round">
    <rect x="-68" y="-59" width="136" height="48" rx="12"/>
    <rect x="-68" y="11" width="136" height="48" rx="12"/>
    <path d="M-47-35H-8M-47 35H-8" stroke="#B2B4BD" stroke-width="4"/>
    <circle cx="42" cy="-35" r="5" fill="#FF7854" stroke="none"/>
    <circle cx="42" cy="35" r="5" fill="#FF7854" stroke="none"/>
  </g>
  <g id="member-devices" transform="translate(1015 134)" fill="none" stroke="#F4F3EF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="-70" y="-60" width="60" height="118" rx="12"/>
    <rect x="14" y="-60" width="60" height="118" rx="12"/>
    <path d="M-43-37V12M41-37V12" stroke="#FF7854" stroke-width="8"/>
    <path d="M-51 35H-29M33 35H55" stroke="#B2B4BD" stroke-width="4"/>
  </g>
  <g id="flow-labels" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" text-anchor="middle" font-weight="600" font-size="42" fill="#F4F3EF">
    <text x="185" y="259">Ведущий</text>
    <text x="600" y="259">Комната</text>
    <text x="1015" y="259">Участники</text>
  </g>
  <text id="room-limit" x="600" y="324" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="40" fill="#B2B4BD">Общая очередь · До 8 устройств</text>
</svg>
