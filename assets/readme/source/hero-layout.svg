<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">AutPlay — ваша музыка, сервер по желанию</title>
  <desc id="description">Карточка трека из Android-приложения AutPlay: обложка, название, исполнитель, пауза и лайк. Локальное воспроизведение доступно без сервера.</desc>
  <defs><clipPath id="card"><rect x="718" y="38" width="422" height="554" rx="28"/></clipPath></defs>
  <rect width="1200" height="630" rx="32" fill="#111215"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="64" y="111" font-size="26" font-weight="600" fill="#B2B4BD">Музыкальный плеер для Android</text>
    <text x="58" y="255" font-size="116" font-weight="700" letter-spacing="-5" fill="#F4F3EF">AutPlay</text>
    <text x="64" y="343" font-size="51" font-weight="600" fill="#F4F3EF">Ваша музыка.</text>
    <text x="64" y="410" font-size="44" font-weight="600" fill="#FF7854">Сервер по желанию.</text>
    <text x="64" y="514" font-size="29" fill="#B2B4BD">Начните с файла на телефоне.</text>
  </g>
  <g clip-path="url(#card)">
    <rect x="718" y="38" width="422" height="554" fill="#111215"/>
    <image x="691" y="-153" width="470" height="1017.936" xlink:href="home-with-cover.png"/>
  </g>
</svg>
