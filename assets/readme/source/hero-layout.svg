<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title description">
  <title id="title">AutPlay — listen now, sync later</title>
  <desc id="description">A cinematic Resonance Lens motif frames a real AutPlay Android Home screenshot. The Android player works locally; a personal server is optional.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b10"/>
      <stop offset="0.58" stop-color="#11131a"/>
      <stop offset="1" stop-color="#18121a"/>
    </linearGradient>
    <radialGradient id="coral-glow" cx="0.62" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#ff5b35" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#ff5b35" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ice-glow" cx="0.78" cy="0.42" r="0.5">
      <stop offset="0" stop-color="#7ddcff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7ddcff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="filament" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6846" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#ff6846"/>
      <stop offset="0.7" stop-color="#7ddcff"/>
      <stop offset="1" stop-color="#7ddcff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.58"/>
    </filter>
    <clipPath id="screen-clip">
      <rect x="1008" y="76" width="314" height="568" rx="34"/>
    </clipPath>
  </defs>

  <rect width="1440" height="720" rx="34" fill="url(#background)"/>
  <rect width="1440" height="720" rx="34" fill="url(#coral-glow)"/>
  <rect width="1440" height="720" rx="34" fill="url(#ice-glow)"/>
  <path d="M0 606 C166 540 302 682 472 602 C633 526 777 671 942 587 C1092 512 1246 621 1440 553" fill="none" stroke="url(#filament)" stroke-width="2" opacity="0.66"/>
  <path d="M0 618 C154 572 298 642 464 610 C638 577 748 626 928 592 C1110 558 1248 586 1440 566" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.08"/>

  <g id="copy" font-family="Inter, Segoe UI, Arial, sans-serif">
    <g transform="translate(76 70)">
      <rect width="158" height="34" rx="17" fill="#ff5b35"/>
      <text x="79" y="23" fill="#0b0b10" font-size="14" font-weight="800" text-anchor="middle" letter-spacing="1.8">AUTPLAY 0.3</text>
    </g>
    <text x="76" y="194" fill="#f7f3ed" font-size="76" font-weight="780" letter-spacing="-3.4">Слушать сразу.</text>
    <text x="76" y="270" fill="#f7f3ed" font-size="76" font-weight="780" letter-spacing="-3.4">Синхронизировать потом.</text>
    <text x="80" y="326" fill="#c9c5bd" font-size="24">Local-first Android-плеер. Личный сервер — по желанию.</text>
    <g transform="translate(78 372)" font-size="16" font-weight="650">
      <rect width="190" height="44" rx="22" fill="#f7f3ed" fill-opacity="0.09" stroke="#f7f3ed" stroke-opacity="0.16"/>
      <circle cx="24" cy="22" r="6" fill="#7ddcff"/>
      <text x="42" y="28" fill="#f7f3ed">Offline playback</text>
      <rect x="204" width="236" height="44" rx="22" fill="#f7f3ed" fill-opacity="0.09" stroke="#f7f3ed" stroke-opacity="0.16"/>
      <circle cx="228" cy="22" r="6" fill="#ff7a55"/>
      <text x="246" y="28" fill="#f7f3ed">Private server optional</text>
    </g>
    <text x="80" y="474" fill="#8d8a86" font-size="15" font-weight="650" letter-spacing="1.4">ANDROID APK  •  CPU SERVER INSTALLER  •  WEB-APPROVED PAIRING</text>
    <text x="80" y="656" fill="#ff8768" font-size="16" font-weight="700">Development pre-release</text>
    <text x="276" y="656" fill="#77777f" font-size="16">Resonance Lens — design direction, not shipped behavior</text>
  </g>

  <g id="subject" transform="translate(610 308)">
    <image href="hero-subject.png" x="0" y="0" width="520" height="260" preserveAspectRatio="xMidYMid meet" opacity="0.96"/>
  </g>

  <g id="android-proof" filter="url(#shadow)">
    <rect x="990" y="58" width="350" height="604" rx="52" fill="#08090d" stroke="#4b4e58" stroke-width="2"/>
    <rect x="1120" y="70" width="90" height="8" rx="4" fill="#262933"/>
    <image href="../../../docs/implementation/evidence/frontend_m4/physical_samsung_m52/home_ru_light.png" x="1008" y="76" width="314" height="698" preserveAspectRatio="xMidYMin slice" clip-path="url(#screen-clip)"/>
    <rect x="1008" y="76" width="314" height="568" rx="34" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>
  </g>
  <g transform="translate(1022 620)" font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect width="286" height="54" rx="27" fill="#11131a" stroke="#7ddcff" stroke-opacity="0.35"/>
    <circle cx="27" cy="27" r="7" fill="#63d790"/>
    <text x="46" y="24" fill="#f7f3ed" font-size="14" font-weight="750">REAL ANDROID UI</text>
    <text x="46" y="41" fill="#94949c" font-size="11">Samsung · local library · playback</text>
  </g>
</svg>
