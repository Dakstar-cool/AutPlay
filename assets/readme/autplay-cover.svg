<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="284" viewBox="0 0 1200 284" role="img" aria-labelledby="title desc">
  <title id="title">AutPlay</title>
  <desc id="desc">Музыка на Android и Mac. Справа — медная кнопка воспроизведения «Моей волны» в центре дорожек пластинки.</desc>
  <defs>
    <clipPath id="frame"><rect width="1200" height="284" rx="22"/></clipPath>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2=".45" gradientUnits="objectBoundingBox">
      <stop stop-color="#252C35"/>
      <stop offset="1" stop-color="#192028"/>
    </linearGradient>
    <linearGradient id="record" x2=".84" y2="1">
      <stop stop-color="#46515D"/>
      <stop offset=".4" stop-color="#28303A"/>
      <stop offset=".72" stop-color="#1D232C"/>
      <stop offset="1" stop-color="#354150"/>
    </linearGradient>
    <linearGradient id="label" x2="1" y2=".7">
      <stop stop-color="#F4BD98"/>
      <stop offset="1" stop-color="#CF8861"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="284" fill="url(#surface)"/>
    <g transform="translate(1006 149)">
      <circle r="292" fill="url(#record)" stroke="#4C5863" stroke-width="2"/>
      <g fill="none" stroke="#89939B" stroke-opacity=".28">
        <circle r="277"/><circle r="271"/>
        <circle r="245"/><circle r="240"/><circle r="235"/>
        <circle r="206"/><circle r="201"/>
        <circle r="175"/><circle r="170"/><circle r="165"/>
        <circle r="137"/><circle r="132"/>
      </g>
      <circle r="112" fill="none" stroke="#65717D" stroke-width="3"/>
      <path d="M-112 0A112 112 0 0 1 -47 -102" fill="none" stroke="#F2AD84" stroke-width="4" stroke-linecap="round"/>
      <circle r="87" fill="url(#label)"/>
      <path d="M-14 -25a3 3 0 0 1 4 -2l38 24a4 4 0 0 1 0 7l-38 23a3 3 0 0 1 -4 -2z" fill="#292D35"/>
    </g>
    <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
      <text x="59" y="151" font-size="128" font-weight="700" letter-spacing="-7" fill="#F9F5EF">AutPlay</text>
      <text x="67" y="227" font-size="49" font-weight="400" fill="#E6D9C5">Музыка на Android и Mac</text>
    </g>
  </g>
</svg>
