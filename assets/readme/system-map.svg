<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
  <title id="title">AutPlay system map</title>
  <desc id="desc">Локальное Android-действие атомарно попадает в Room и Journal, Media3 воспроизводит доступный источник, а необязательный личный сервер добавляет sync, PostgreSQL, Vault, рекомендации и Wave.</desc>
  <defs>
    <marker id="arrow-coral" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#FF6B45"/></marker>
    <marker id="arrow-ice" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#83D6FF"/></marker>
  </defs>
  <rect width="1200" height="590" rx="28" fill="#0B0B10"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="54" y="56" fill="#FF8B70" font-size="19" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="2">ONE LOCAL COMMIT · OPTIONAL REMOTE EXTENSION</text>
    <text x="54" y="104" fill="#F7F3ED" font-size="40" font-weight="770">Слушать сразу. Синхронизировать потом.</text>

    <g transform="translate(54 142)">
      <rect width="462" height="368" rx="26" fill="#17161D" stroke="#4A4652" stroke-width="2"/>
      <text x="30" y="46" fill="#FF8B70" font-size="19" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">ANDROID · AUTHORITATIVE LOCAL PATH</text>
      <rect x="30" y="72" width="402" height="66" rx="18" fill="#F7F3ED"/>
      <text x="52" y="104" fill="#171419" font-size="22" font-weight="720">UI intent</text>
      <text x="52" y="128" fill="#6E6973" font-size="18">play · playlist · queue · library mutation</text>
      <path d="M231 140V168" stroke="#FF6B45" stroke-width="3" marker-end="url(#arrow-coral)"/>
      <rect x="30" y="174" width="402" height="76" rx="18" fill="#2A2020" stroke="#FF6B45" stroke-width="2"/>
      <text x="52" y="207" fill="#F7F3ED" font-size="22" font-weight="720">Room transaction</text>
      <text x="52" y="234" fill="#FFB7A6" font-size="19">domain state + Journal/outbox fact</text>
      <path d="M231 252V280" stroke="#FF6B45" stroke-width="3" marker-end="url(#arrow-coral)"/>
      <rect x="30" y="286" width="190" height="54" rx="17" fill="#FF6B45"/>
      <text x="125" y="320" text-anchor="middle" fill="#171419" font-size="20" font-weight="760">Media3 plays</text>
      <rect x="242" y="286" width="190" height="54" rx="17" fill="#24222B" stroke="#5A5662" stroke-width="2"/>
      <text x="337" y="320" text-anchor="middle" fill="#F7F3ED" font-size="20" font-weight="700">WorkManager sync</text>
    </g>

    <g transform="translate(526 142)">
      <path d="M0 118H116" stroke="#83D6FF" stroke-width="4" stroke-dasharray="10 9" marker-end="url(#arrow-ice)"/>
      <text x="58" y="92" text-anchor="middle" fill="#83D6FF" font-size="18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">WHEN ONLINE</text>
      <path d="M116 280H0" stroke="#83D6FF" stroke-width="4" stroke-dasharray="10 9" marker-end="url(#arrow-ice)"/>
      <text x="58" y="316" text-anchor="middle" fill="#83D6FF" font-size="18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">PROJECTIONS</text>
    </g>

    <g transform="translate(660 142)">
      <rect width="486" height="368" rx="26" fill="#132633" stroke="#83D6FF" stroke-width="2"/>
      <text x="30" y="46" fill="#BDEAFF" font-size="19" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">PERSONAL SERVER · OPTIONAL</text>
      <g transform="translate(30 72)">
        <rect width="202" height="90" rx="18" fill="#F7F3ED"/>
        <text x="22" y="38" fill="#171419" font-size="22" font-weight="730">CPU API</text>
        <text x="22" y="66" fill="#536D79" font-size="18">auth · sync · social</text>
        <rect x="224" width="202" height="90" rx="18" fill="#F7F3ED"/>
        <text x="246" y="38" fill="#171419" font-size="22" font-weight="730">PostgreSQL</text>
        <text x="246" y="66" fill="#536D79" font-size="18">metadata · jobs · rights</text>
        <rect y="112" width="202" height="90" rx="18" fill="#1E4255" stroke="#83D6FF" stroke-width="2"/>
        <text x="22" y="150" fill="#F7F3ED" font-size="22" font-weight="730">Vault</text>
        <text x="22" y="178" fill="#BDEAFF" font-size="18">immutable verified bytes</text>
        <rect x="224" y="112" width="202" height="90" rx="18" fill="#1A303B" stroke="#5BA8C8" stroke-width="2"/>
        <text x="246" y="150" fill="#F7F3ED" font-size="22" font-weight="730">CPU worker</text>
        <text x="246" y="178" fill="#BDEAFF" font-size="18">import · rank · cleanup</text>
      </g>
      <text x="243" y="322" text-anchor="middle" fill="#9FC9DB" font-size="19">GPU enrichment stays physically isolated;</text>
      <text x="243" y="348" text-anchor="middle" fill="#9FC9DB" font-size="19">core readiness never depends on it.</text>
    </g>

    <g transform="translate(54 548)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">
      <circle cx="8" cy="-6" r="7" fill="#70D69A"/>
      <text x="26" y="0" fill="#9A97A0">SERVER DOWN → LOCAL LIBRARY, QUEUE AND PLAYBACK REMAIN AVAILABLE</text>
      <text x="1092" y="0" text-anchor="end" fill="#83D6FF">NO REDIS · NO KAFKA · NO REQUIRED CLOUD</text>
    </g>
  </g>
</svg>
