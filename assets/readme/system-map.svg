<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
  <title id="title">Схема локальной архитектуры AutPlay</title>
  <desc id="desc">Android локально сохраняет изменения медиатеки и события автономного журнала, Media3 сначала воспроизводит локальный контент, а необязательный сервер добавляет синхронизацию PostgreSQL, неизменяемый Vault, рекомендации и координацию Wave в доверенной сети.</desc>

  <defs>
    <marker id="arrow-coral" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#B42318"/>
    </marker>
    <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#00639B"/>
    </marker>
  </defs>

  <rect width="1200" height="590" rx="28" fill="#FFF8F7"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="54" y="58" fill="#410001" font-size="20" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="2">ОДНО ЛОКАЛЬНОЕ ДЕЙСТВИЕ · ДВА НАДЁЖНЫХ ПУТИ</text>
    <text x="54" y="104" fill="#141111" font-size="38" font-weight="750">Слушайте сразу. Синхронизация — при подключении.</text>

    <g transform="translate(54 146)">
      <rect width="430" height="370" rx="26" fill="#141111"/>
      <text x="34" y="48" fill="#FFB4AB" font-size="19" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">ANDROID · LOCAL-FIRST</text>

      <g transform="translate(34 76)">
        <rect width="362" height="68" rx="16" fill="#FFF8F7"/>
        <path d="M26 20L64 34L26 48Z" fill="#B42318"/>
        <text x="86" y="31" fill="#410001" font-size="22" font-weight="700">Действие в медиатеке</text>
        <text x="86" y="53" fill="#765653" font-size="17">добавить · переставить · играть</text>
      </g>

      <path d="M215 147V176" stroke="#FFB4AB" stroke-width="3" marker-end="url(#arrow-coral)"/>

      <g transform="translate(34 180)">
        <rect width="362" height="76" rx="16" fill="#2A2423" stroke="#765653"/>
        <text x="24" y="32" fill="#FFF8F7" font-size="21" font-weight="700">Одна транзакция Room</text>
        <text x="24" y="57" fill="#E4BDB7" font-size="18">состояние + событие журнала</text>
      </g>

      <path d="M215 260V289" stroke="#FFB4AB" stroke-width="3" marker-end="url(#arrow-coral)"/>

      <g transform="translate(34 293)">
        <rect width="174" height="52" rx="14" fill="#7F1D1D"/>
        <text x="87" y="33" text-anchor="middle" fill="#FFDAD5" font-size="19" font-weight="700">Media3 играет</text>
        <rect x="188" width="174" height="52" rx="14" fill="#2A2423" stroke="#765653"/>
        <text x="275" y="33" text-anchor="middle" fill="#FFF8F7" font-size="19" font-weight="700">Синхр. в фоне</text>
      </g>
    </g>

    <g transform="translate(506 146)">
      <path d="M0 126H132" fill="none" stroke="#00639B" stroke-width="4" stroke-dasharray="10 10" marker-end="url(#arrow-teal)"/>
      <text x="66" y="100" text-anchor="middle" fill="#00639B" font-size="17" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">ОНЛАЙН</text>
      <path d="M132 280H0" fill="none" stroke="#00639B" stroke-width="4" stroke-dasharray="10 10" marker-end="url(#arrow-teal)"/>
      <text x="66" y="315" text-anchor="middle" fill="#00639B" font-size="17" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">ПРОЕКЦИИ</text>
    </g>

    <g transform="translate(660 146)">
      <rect width="486" height="370" rx="26" fill="#F1F8FF" stroke="#78B8E2" stroke-width="2"/>
      <text x="32" y="48" fill="#00639B" font-size="19" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">ЛИЧНЫЙ СЕРВЕР ПО ЖЕЛАНИЮ</text>

      <g transform="translate(32 76)">
        <rect width="200" height="90" rx="16" fill="#FFFFFF" stroke="#78B8E2"/>
        <text x="20" y="35" fill="#141111" font-size="22" font-weight="700">FastAPI</text>
        <text x="20" y="63" fill="#3F6680" font-size="18">друзья · синхр. · Wave</text>
        <rect x="222" width="200" height="90" rx="16" fill="#FFFFFF" stroke="#78B8E2"/>
        <text x="242" y="35" fill="#141111" font-size="22" font-weight="700">PostgreSQL</text>
        <text x="242" y="63" fill="#3F6680" font-size="18">данные · stats · jobs</text>
      </g>

      <path d="M243 172V205" stroke="#00639B" stroke-width="3" marker-end="url(#arrow-teal)"/>

      <g transform="translate(32 209)">
        <rect width="200" height="88" rx="16" fill="#00639B"/>
        <text x="20" y="35" fill="#F4FAFF" font-size="22" font-weight="700">Vault</text>
        <text x="20" y="63" fill="#CDE5FF" font-size="18">байты SHA-256</text>
        <rect x="222" width="200" height="88" rx="16" fill="#FFFFFF" stroke="#78B8E2"/>
        <text x="242" y="35" fill="#141111" font-size="22" font-weight="700">CPU-воркер</text>
        <text x="242" y="63" fill="#3F6680" font-size="18">приём · импорт · ранг</text>
      </g>

      <text x="243" y="337" text-anchor="middle" fill="#3F6680" font-size="18">GPU-обогащение изолировано и включается вручную;</text>
      <text x="243" y="361" text-anchor="middle" fill="#3F6680" font-size="18">готовность ядра от него не зависит.</text>
    </g>

    <g transform="translate(54 544)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">
      <circle cx="7" cy="-6" r="7" fill="#B42318"/>
      <text x="24" y="0" fill="#765653">сервер недоступен → медиатека, очередь и воспроизведение работают локально</text>
    </g>
  </g>
</svg>
