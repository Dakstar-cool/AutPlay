<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="550" viewBox="0 0 1200 550" role="img" aria-labelledby="title desc">
  <title id="title">Адаптивный Compose-интерфейс AutPlay</title>
  <desc id="desc">Compact, medium и expanded компоновки используют один playback state, постоянный мини-плеер и подходящую ширине навигацию без создания нового player session.</desc>
  <rect width="1200" height="550" rx="28" fill="#F7F3ED"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="54" y="54" fill="#B84226" font-size="19" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="2">ADAPTIVE COMPOSE · ONE PLAYBACK STATE</text>
    <text x="54" y="102" fill="#171419" font-size="40" font-weight="770">Интерфейс меняет форму, не контекст</text>

    <g transform="translate(54 138)">
      <text x="108" y="0" text-anchor="middle" fill="#6E6973" font-size="19" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">COMPACT · &lt;600dp</text>
      <rect y="22" width="216" height="338" rx="30" fill="#17161D"/>
      <rect x="12" y="36" width="192" height="310" rx="22" fill="#FFFFFF"/>
      <text x="30" y="72" fill="#171419" font-size="21" font-weight="760">AutPlay</text>
      <rect x="28" y="92" width="160" height="82" rx="18" fill="#FBE0D8"/>
      <text x="44" y="124" fill="#8B321E" font-size="19" font-weight="720">Главная</text>
      <path d="M44 146H154" stroke="#FF6B45" stroke-width="6" stroke-linecap="round"/>
      <rect x="28" y="190" width="160" height="38" rx="12" fill="#EEEAE5"/>
      <rect x="20" y="250" width="176" height="54" rx="16" fill="#17161D"/>
      <circle cx="48" cy="277" r="14" fill="#FF6B45"/>
      <text x="72" y="283" fill="#F7F3ED" font-size="17">мини-плеер</text>
      <path d="M38 326H178" stroke="#D9D3CC" stroke-width="3"/>
    </g>

    <g transform="translate(322 138)">
      <text x="176" y="0" text-anchor="middle" fill="#6E6973" font-size="19" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">MEDIUM · 600–839dp</text>
      <rect y="22" width="352" height="338" rx="28" fill="#17161D"/>
      <rect x="14" y="36" width="324" height="310" rx="20" fill="#FFFFFF"/>
      <rect x="14" y="36" width="70" height="310" rx="20" fill="#24222B"/>
      <rect x="68" y="36" width="16" height="310" fill="#24222B"/>
      <g fill="#BDEAFF" font-size="23" text-anchor="middle"><text x="49" y="82">⌂</text><text x="49" y="130">⌕</text><text x="49" y="178">♫</text><text x="49" y="226">≋</text></g>
      <text x="110" y="76" fill="#171419" font-size="22" font-weight="760">Медиатека</text>
      <rect x="110" y="98" width="196" height="52" rx="15" fill="#E7F5FC"/>
      <text x="128" y="130" fill="#17617F" font-size="18">поиск и фильтры</text>
      <rect x="110" y="168" width="196" height="42" rx="13" fill="#EEEAE5"/>
      <rect x="110" y="224" width="196" height="42" rx="13" fill="#EEEAE5"/>
      <rect x="98" y="286" width="222" height="48" rx="15" fill="#17161D"/>
      <circle cx="124" cy="310" r="13" fill="#83D6FF"/>
      <text x="148" y="316" fill="#F7F3ED" font-size="17">тот же мини-плеер</text>
    </g>

    <g transform="translate(726 138)">
      <text x="210" y="0" text-anchor="middle" fill="#6E6973" font-size="19" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">EXPANDED · ≥840dp</text>
      <rect y="22" width="420" height="338" rx="28" fill="#17161D"/>
      <rect x="14" y="36" width="392" height="310" rx="20" fill="#FFFFFF"/>
      <rect x="14" y="36" width="78" height="310" rx="20" fill="#24222B"/>
      <rect x="74" y="36" width="18" height="310" fill="#24222B"/>
      <g fill="#FF9A82" font-size="23" text-anchor="middle"><text x="53" y="82">⌂</text><text x="53" y="130">⌕</text><text x="53" y="178">♫</text><text x="53" y="226">≋</text></g>
      <rect x="114" y="64" width="122" height="188" rx="18" fill="#FBE0D8"/>
      <text x="132" y="98" fill="#8B321E" font-size="19" font-weight="720">Список</text>
      <rect x="256" y="64" width="126" height="188" rx="18" fill="#E7F5FC"/>
      <text x="274" y="98" fill="#17617F" font-size="19" font-weight="720">Деталь</text>
      <path d="M132 126H216M132 156H216M274 126H362M274 156H362" stroke="#BEB8B1" stroke-width="5" stroke-linecap="round"/>
      <rect x="104" y="286" width="288" height="48" rx="15" fill="#17161D"/>
      <circle cx="132" cy="310" r="13" fill="#FF6B45"/>
      <text x="156" y="316" fill="#F7F3ED" font-size="17">playback остаётся доступным</text>
    </g>

    <g transform="translate(54 520)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">
      <text x="0" y="0" fill="#6E6973">RESIZE · ROTATION · FOLD → NO NEW PLAYER SESSION</text>
      <text x="1092" y="0" text-anchor="end" fill="#B84226">HOME · SEARCH · LIBRARY · WAVE · PROFILE</text>
    </g>
  </g>
</svg>
