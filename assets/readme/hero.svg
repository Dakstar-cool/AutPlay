    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#8FCBFF"/>
    </marker>
  </defs>
  <rect width="1200" height="420" rx="28" fill="#08090B"/>
  <path d="M0 350H1200M682 0V420" stroke="#34353D" stroke-width="1"/>

