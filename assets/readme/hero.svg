<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">AutPlay — музыка принадлежит устройству, сервер остаётся выбором</title>
  <desc id="desc">Локальная Android-медиатека, ручные плейлисты и управляемая очередь соединены с приватными друзьями, гостевым доступом к одной Wave-комнате, статистикой по выбору и необязательным личным сервером.</desc>
