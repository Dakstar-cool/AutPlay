<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">AutPlay — local-first музыка с необязательным личным сервером</title>
  <desc id="desc">Название AutPlay, обещание локального владения музыкой и проектный мотив выразительных глаз рядом с проверенным Android local-first контуром.</desc>
  <rect width="1200" height="420" rx="28" fill="#0B0B10"/>
  <path d="M54 350H1146" stroke="#302E37" stroke-width="2"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <g transform="translate(56 44)">
      <text x="0" y="20" fill="#FF8B70" font-size="19" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="2">ANDROID · LOCAL-FIRST MUSIC SYSTEM</text>
      <text x="0" y="112" fill="#F7F3ED" font-size="80" font-weight="780" letter-spacing="-4">AutPlay</text>
      <text x="0" y="170" fill="#F7F3ED" font-size="32" font-weight="720">Музыка остаётся вашей.</text>
      <text x="0" y="210" fill="#9A97A0" font-size="28">Сервер расширяет, но не держит плеер.</text>
      <g transform="translate(0 252)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700">
        <rect width="148" height="44" rx="22" fill="#3B201B" stroke="#FF6B45" stroke-width="2"/>
        <text x="74" y="28" text-anchor="middle" fill="#FFD3C7">OFFLINE FIRST</text>
        <rect x="162" width="166" height="44" rx="22" fill="#17161D" stroke="#4B4853" stroke-width="2"/>
        <text x="245" y="28" text-anchor="middle" fill="#F7F3ED">PRIVATE DEFAULT</text>
        <rect x="342" width="202" height="44" rx="22" fill="#132633" stroke="#83D6FF" stroke-width="2"/>
        <text x="443" y="28" text-anchor="middle" fill="#BDEAFF">OPTIONAL SERVER</text>
      </g>
    </g>
    <g transform="translate(690 38)">
      <rect width="454" height="286" rx="28" fill="#15141B" stroke="#35323D" stroke-width="2"/>
      <text x="28" y="40" fill="#83D6FF" font-size="18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="1.5">AUTPLAY FACE · PRODUCT CONCEPT</text>
      <text x="28" y="72" fill="#9A97A0" font-size="20">calm + dark · playing</text>
      <g transform="translate(30 96)">
        <rect width="186" height="112" rx="50" fill="#201E28" stroke="#FF6B45" stroke-width="3"/>
        <rect x="208" width="186" height="112" rx="50" fill="#201E28" stroke="#83D6FF" stroke-width="3"/>
        <path d="M20 43C61 16 125 16 166 43" fill="none" stroke="#FF9A82" stroke-width="7" stroke-linecap="round"/>
        <path d="M228 43C269 16 333 16 374 43" fill="none" stroke="#BDEAFF" stroke-width="7" stroke-linecap="round"/>
        <ellipse cx="104" cy="65" rx="20" ry="29" fill="#F7F3ED"/>
        <ellipse cx="290" cy="65" rx="20" ry="29" fill="#F7F3ED"/>
        <circle cx="109" cy="71" r="10" fill="#0B0B10"/>
        <circle cx="285" cy="71" r="10" fill="#0B0B10"/>
        <circle cx="113" cy="66" r="3" fill="#83D6FF"/>
        <circle cx="289" cy="66" r="3" fill="#FF6B45"/>
      </g>
      <g transform="translate(30 228)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">
        <circle cx="8" cy="-6" r="7" fill="#70D69A"/>
        <text x="26" y="0" fill="#F7F3ED">PLAYER VERIFIED</text>
        <text x="394" y="0" text-anchor="end" fill="#9A97A0">FACE NOT IMPLEMENTED</text>
      </g>
    </g>
    <g transform="translate(56 384)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">
      <text x="0" y="0" fill="#9A97A0">Room + Journal · Media3 · FastAPI + PostgreSQL · immutable Vault</text>
      <text x="1088" y="0" text-anchor="end" fill="#83D6FF">LOCAL ACTIONS NEVER WAIT FOR SERVER</text>
    </g>
  </g>
