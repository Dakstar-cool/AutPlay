[project]
name = "autplay-server"
version = "0.0.0"
description = "AutPlay server architecture skeleton"
readme = "README.md"
requires-python = ">=3.14.7,<3.15"
dependencies = [
    "alembic==1.19.1",
    "fastapi==0.141.1",
    "psycopg[binary]==3.3.4",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "sqlalchemy==2.0.52",
]

[dependency-groups]
dev = [
    "mypy==2.3.0",
    "pytest==9.1.1",
    "ruff==0.16.2",
]

[build-system]
requires = ["uv_build==0.12.3"]
build-backend = "uv_build"

[tool.uv]
required-version = "==0.12.3"

[tool.uv.build-backend]
module-name = "autplay"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.format]
line-ending = "lf"
quote-style = "double"

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
