[project]
name = "autplay-server"
version = "0.0.0"
description = "AutPlay server architecture skeleton"
readme = "README.md"
requires-python = ">=3.14.7,<3.15"
dependencies = [
    "alembic==1.19.1",
    "argon2-cffi==25.1.0",
    "cryptography==50.0.0",
    "fastapi==0.141.1",
    "jinja2==3.1.6",
    "pgvector==0.5.0",
    "prometheus-client==0.25.0",
    "psycopg[binary]==3.3.4",
    "python-multipart==0.0.32",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "PyJWT==2.13.0",
    "rfc8785==0.1.4",
    "sqlalchemy==2.0.52",
    "uvicorn==0.51.0",
]

[project.scripts]
autplay-admin = "autplay.entrypoints.admin:main"
autplay-api = "autplay.entrypoints.api:main"
autplay-stream = "autplay.entrypoints.stream:main"
autplay-worker-cpu = "autplay.entrypoints.worker_cpu:main"

[dependency-groups]
dev = [
    "httpx2==2.9.0",
    "mypy==2.3.0",
    "playwright==1.62.0",
    "pytest==9.1.1",
    "ruff==0.16.2",
]

[build-system]
requires = ["uv_build==0.12.3"]
build-backend = "uv_build"

[tool.uv]
required-version = "==0.12.3"

[tool.uv.build-backend]
module-name = "autplay"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.format]
line-ending = "lf"
quote-style = "double"

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
