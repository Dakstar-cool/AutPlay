[project]
name = "autplay-gpu-worker"
version = "0.0.0"
description = "Isolated optional AutPlay GPU enrichment worker"
requires-python = ">=3.14.7,<3.15"
dependencies = [
    "autplay-server",
    "onnxruntime-gpu[cuda,cudnn]==1.26.0",
]

[project.scripts]
autplay-ml-gpu = "autplay_gpu.entrypoint:main"

[dependency-groups]
dev = [
    "mypy==2.3.0",
    "pytest==9.1.1",
    "ruff==0.16.2",
]

[build-system]
requires = ["uv_build==0.12.3"]
build-backend = "uv_build"

[tool.uv]
required-version = "==0.12.3"

[tool.uv.sources]
autplay-server = { path = "../server", editable = false }

[tool.uv.build-backend]
module-name = "autplay_gpu"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.format]
line-ending = "lf"
quote-style = "double"

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
