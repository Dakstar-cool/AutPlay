[project]
name = "autplay-sona-training"
version = "0.0.0"
description = "Isolated Sona-Lite tokenizer, training, and ONNX export tools"
requires-python = ">=3.14.7,<3.15"
dependencies = [
    "autplay-server",
    "onnx==1.22.0",
    "onnxscript==0.7.1",
    "onnxruntime==1.26.0; sys_platform == 'win32'",
    "onnxruntime-gpu[cuda,cudnn]==1.26.0; sys_platform == 'linux'",
    "torch==2.14.0",
]

[project.scripts]
autplay-sona-training = "autplay_sona_training.cli:main"

[dependency-groups]
dev = [
    "mypy==2.3.0",
    "pytest==9.1.1",
    "ruff==0.16.2",
]

[build-system]
requires = ["uv_build==0.12.3"]
build-backend = "uv_build"

[tool.uv]
required-version = "==0.12.3"
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
autplay-server = { path = "../../server", editable = false }
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.format]
line-ending = "lf"
quote-style = "double"

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]
mypy_path = "../../server/src"

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["src", "../../server/src"]
