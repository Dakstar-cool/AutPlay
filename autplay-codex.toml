[harness]
state_dir = ".autplay-codex"
backlog_file = "docs/implementation/AUTPLAY_CODEX_BACKLOG.json"
task_result_schema = "schemas/autplay-codex-task-result.schema.json"
review_result_schema = "schemas/autplay-codex-review-result.schema.json"
max_review_iterations = 2
max_fix_iterations = 2
max_subagents = 3
command_timeout_seconds = 1800
log_level = "info"
protected_branches = ["main", "master"]

[models]
clear_repeatable_model = "gpt-5.6-luna"
clear_repeatable_reasoning = "low"
normal_engineering_model = "gpt-5.6-terra"
normal_engineering_reasoning = "medium"
complex_engineering_model = "gpt-5.6-sol"
complex_engineering_reasoning = "high"
milestone_model = "gpt-5.6-sol"
milestone_reasoning = "xhigh"
review_model = "gpt-5.6-terra"
review_reasoning = "high"

[checks]
targeted_windows = [
    ["uv", "run", "ruff", "check", "--config", "pyproject.toml", "tools/autplay_codex"],
    ["uv", "run", "ruff", "format", "--check", "--config", "pyproject.toml", "tools/autplay_codex"],
    ["uv", "run", "mypy", "--config-file", "pyproject.toml", "tools/autplay_codex/src", "tools/autplay_codex/tests"],
    ["uv", "run", "pytest", "-c", "pyproject.toml", "tools/autplay_codex/tests"],
]
targeted_posix = [
    ["uv", "run", "ruff", "check", "--config", "pyproject.toml", "tools/autplay_codex"],
    ["uv", "run", "ruff", "format", "--check", "--config", "pyproject.toml", "tools/autplay_codex"],
    ["uv", "run", "mypy", "--config-file", "pyproject.toml", "tools/autplay_codex/src", "tools/autplay_codex/tests"],
    ["uv", "run", "pytest", "-c", "pyproject.toml", "tools/autplay_codex/tests"],
]
final_windows = [
    ["powershell.exe", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "scripts/check.ps1"],
]
final_posix = [
    ["bash", "scripts/check.sh"],
]
